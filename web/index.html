<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTC Terminal</title>
    <link rel="stylesheet" href="@xterm/xterm/css/xterm.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #00ff00;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .terminal-container {
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.5);
            max-width: min(95vw, 800px);
            max-height: min(95vh, 600px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            background: linear-gradient(to bottom, #4a4a4a, #333);
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            min-height: 36px;
        }

        .terminal-title {
            color: #ccc;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-buttons {
            display: flex;
            gap: 6px;
        }

        .terminal-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .close { background: #ff5f5f; }
        .minimize { background: #ffbf00; }
        .maximize { background: #00ff00; }

        .tab-container {
            background: #2a2a2a;
            border-bottom: 1px solid #444;
            display: flex;
            padding: 0;
        }

        .tab {
            background: #3a3a3a;
            color: #ccc;
            border: none;
            border-right: 1px solid #555;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.2s;
            flex: 1;
            min-width: 0;
        }

        .tab:hover {
            background: #4a4a4a;
            color: #fff;
        }

        .tab.active {
            background: #000;
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
        }

        .tab:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tab-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #terminal {
            width: 100%;
            height: 100%;
        }

        .terminal-wrapper {
            padding: 8px;
            height: 100%;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .terminal-container {
                max-width: 98vw;
                max-height: 90vh;
                margin: 5px;
            }

            .terminal-title {
                font-size: 11px;
            }

            .tab {
                padding: 6px 12px;
                font-size: 11px;
            }

            .terminal-wrapper {
                padding: 4px;
            }
        }

        @media (max-width: 480px) {
            .terminal-container {
                border-radius: 4px;
                max-height: 85vh;
            }

            .terminal-header {
                padding: 6px 8px;
                min-height: 32px;
            }

            .terminal-title {
                font-size: 10px;
            }

            .tab {
                padding: 4px 8px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-title">
                <span>🖥️</span>
                <span>XTC Terminal</span>
            </div>
            <div class="terminal-buttons">
                <button class="terminal-button close"></button>
                <button class="terminal-button minimize"></button>
                <button class="terminal-button maximize"></button>
            </div>
        </div>
        <div class="tab-container">
            <button class="tab active" data-demo="waves">Waves</button>
            <button class="tab" data-demo="matrix">Matrix</button>
            <button class="tab" data-demo="platformer">Platformer</button>
        </div>
        <div class="tab-content">
            <div class="terminal-wrapper">
                <div id="terminal"></div>
            </div>
        </div>
    </div>
    <script type="module" src="xtc.ts"></script>
</body>
</html>
